name: Apply Quality Hub Redesign

on:
  push:
    paths:
      - '.github/workflows/apply-quality-redesign.yml'

permissions:
  contents: write

jobs:
  apply-redesign:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Write redesigned website
        env:
          APP_GZ_B64: 
        run: |
          python - <<'PY'
          import base64, gzip, os
          from pathlib import Path
          data = gzip.decompress(base64.b64decode(os.environ['APP_GZ_B64']))
          Path('index.html').write_bytes(data)
          PY
      - name: Commit redesign
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Fix typography consistency across the quality hub [skip ci]"
            git push origin main
          fi