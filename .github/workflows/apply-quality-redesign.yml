name: Apply Quality Hub Tab Fix

on:
  push:
    paths:
      - '.github/workflows/apply-quality-redesign.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-tabs:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Patch tab markup and refresh assets
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')

          text = text.replace(
              '<link rel="stylesheet" href="quality-redesign.css?v=4">',
              '<link rel="stylesheet" href="quality-redesign.css?v=7">'
          )
          text = text.replace(
              '<div class="tabs"><button class="tab active">Regular Session</button><button class="tab">Sampled Review</button><button class="tab" data-jump="session12">Session 12</button></div>',
              '<div class="tabs"><button class="tab active" data-review-mode="sampling">Session Sampling</button><button class="tab" data-review-mode="full">Full Review</button><button class="tab" data-jump="session12">Session 12</button></div>'
          )
          text = text.replace(
              '<script src="quality-redesign.js?v=4"></script>',
              '<script src="quality-redesign.js?v=7"></script>'
          )

          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit patched page
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if ! git diff --cached --quiet; then
            git commit -m "Fix tabs and refresh deployed assets"
            git push origin main
          fi
