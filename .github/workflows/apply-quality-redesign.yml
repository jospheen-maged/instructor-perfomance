name: Apply Quality Hub Redesign

on:
  push:
    paths:
      - '.github/workflows/apply-quality-redesign.yml'

permissions:
  contents: write

jobs:
  apply-redesign:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Write redesigned website
        env:
          APP_GZ_B64: 
        run: |
          printf '%s' "$APP_GZ_B64" | base64 -d | gzip -d > index.html
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if ! git diff --cached --quiet; then
            git commit -m "Enhance learning experience metric and design [skip ci]"
            git push origin main
          fi