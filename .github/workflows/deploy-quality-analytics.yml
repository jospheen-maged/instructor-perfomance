name: Patch Quality Analytics for Vercel

on:
  push:
    branches: [main]
    paths:
      - "scripts/patch-quality-sla.cjs"
      - ".github/workflows/deploy-quality-analytics.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: quality-analytics-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Patch SLA calculation
        run: node scripts/patch-quality-sla.cjs

      - name: Commit patched dashboard
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/quality-analytics/app.js
          if git diff --cached --quiet; then
            echo "No SLA changes to commit."
            exit 0
          fi
          git commit -m "Fix stage SLA working-hour calculation"
          git push
