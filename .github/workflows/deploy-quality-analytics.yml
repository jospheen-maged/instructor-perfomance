name: Build Quality Analytics for Vercel

on:
  push:
    branches: [main]
    paths:
      - "scripts/quality-payload/**"
      - "scripts/generate-quality-analytics.cjs"
      - ".github/workflows/deploy-quality-analytics.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: quality-analytics-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Generate browser dashboard
        run: node scripts/generate-quality-analytics.cjs

      - name: Commit generated site
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add quality-analytics/index.html quality-analytics/app.js quality-analytics/.nojekyll
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
            exit 0
          fi
          git commit -m "Generate quality analytics dashboard"
          git push
